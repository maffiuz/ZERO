[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ZERO"
version = "1.0.0"
description = "Zero dimensional nuclear fusion reactor simulator"
readme = "README.md"
authors = [
    {name = "Riccardo Vittorio Maffiodo", email = "maffiodor@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.14"

[tool.black]
line-length = 88
target-version = ['py314']

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]